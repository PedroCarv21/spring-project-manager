version: "3.9"

services:
  postgres:
    image: postgres:16.3
    container_name: project-managerdb
    environment:
      POSTGRES_DB: spring-project-manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project-manager-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_projectmanager
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "15432:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
    networks:
      - project-manager-network

volumes:
  postgres_data:

networks:
  project-manager-network:
