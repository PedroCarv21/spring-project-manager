spring:
  application:
    name: springprojectmanager
  datasource:
    url: jdbc:postgresql://localhost:5432/spring-project-manager
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate.format-sql: true
    hibernate:
      ddl-auto: none
springdoc:
  swagger-ui:
    path: /swagger