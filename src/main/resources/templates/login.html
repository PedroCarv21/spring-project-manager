<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
<!--        <link rel="stylesheet" href="../static/css/login.css">-->
</head>
<body>
    <form th:action="@{/login}" method="post">
            <h1>Login</h1>
            <input class="entrada" type="text" name="username" placeholder="Nome do usuario"><br><br>
            <input class="entrada" type="password" name="password" placeholder="Senha"><br><br>
            <input type="submit">
            <div>
                <span>Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a> </span>
            </div>
            <p th:text="${param.error} ? 'Nome de usuário e/ou senha incorretos.' : ' '" class="msg_erro"></p>
    </form>
</body>
</html>
